<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Matching Game</title>
  <meta name="description" content="">
  <link rel="stylesheet prefetch" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
  <link rel="stylesheet prefetch" href="https://fonts.googleapis.com/css?family=Coda">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>

  <div class="container game-board">
    <header>
      <h1>Matching Game</h1>
    </header>

    <section class="score-panel">
      <ul class="stars">
        <li>
          <i class="rating fa fa-star-o"></i>
        </li>
        <li>
          <i class="rating fa fa-star-o"></i>
        </li>
        <li>
          <i class="rating fa fa-star-o"></i>
        </li>
      </ul>

      <span class="timer">
        <span class="timer-minutes">00</span>
        <span>:</span>
        <span class="timer-seconds">00</span>
      </span>

      <div>
        <span class="moves">0</span> Moves
      </div>

      <div class="best-score">
        Best: <span id="best-moves">--</span>
      </div>

      <div class="player-turn" style="display: none;">
        Player <span class="current-player">1</span>'s Turn
      </div>

      <div class="restart">
        <i class="fa fa-repeat"></i>
      </div>
      <div class="change-mode">
        <i class="fa fa-cog"></i>
      </div>
    </section>

    <ul class="deck">
    </ul>
  </div>

  <div class="container mode-dialog" style="display: flex;">
    <section class="mode-content">
      <h1>Select Game Mode</h1>
      <button id="mode-std">Standard</button>
      <button id="mode-seq-1p">Sequential (1 Player)</button>
      <button id="mode-seq-2p">Sequential (2 Players)</button>
      <button id="mode-online">Online Multiplayer</button>
    </section>
  </div>

  <!-- Online Menu Dialog -->
  <div class="container online-menu-dialog" style="display: none;">
    <section class="mode-content">
      <h1>Online Mode</h1>
      <button id="btn-create-room">Create Room</button>
      <button id="btn-join-room">Join Room</button>
      <button id="btn-online-back">Back</button>
    </section>
  </div>

  <!-- Join Room Dialog -->
  <div class="container join-room-dialog" style="display: none;">
    <section class="mode-content">
      <h1>Enter Room Code</h1>
      <input type="number" id="room-code-input" placeholder="1234" maxlength="4"
        style="font-size: 20px; padding: 10px; margin-bottom: 10px; text-align: center;">
      <button id="btn-join-submit">Join</button>
      <button id="btn-join-back">Back</button>
    </section>
  </div>

  <!-- Lobby Dialog -->
  <div class="container lobby-dialog" style="display: none;">
    <section class="mode-content">
      <h1>Lobby <span id="lobby-room-code"></span></h1>
      <div id="lobby-players-list" style="margin-bottom: 20px; font-size: 1.2em;">
        <!-- Player list goes here -->
      </div>
      <button id="btn-start-game" style="display: none;">Start Game</button>
      <p id="waiting-msg">Waiting for host...</p>
      <button id="btn-lobby-leave">Leave Room</button>
    </section>
  </div>

  <!-- Online HUD (In-game) -->
  <div class="online-hud"
    style="display: none; position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px;">
    <h3>Opponents</h3>
    <ul id="online-progress-list" style="list-style: none; padding: 0;">
      <!-- Updates go here -->
    </ul>
  </div>

  <div class="container size-dialog" style="display: none;">
    <section class="mode-content">
      <h1>Select Grid Size</h1>
      <button id="size-4x4">4 x 4</button>
      <button id="size-6x6">6 x 6</button>
    </section>
  </div>

  <div class="container win-dialog">
    <section>
      <div>
        <i class="win-icon fa fa-check-circle-o"></i>
        <h1 class="win-banner">You are a Winner!</h1>
        <p class="win-summary">You won in
          <span class="win-minutes">00</span> minutes,
          <span class="win-seconds">00</span> seconds, using
          <span class="win-moves">00</span> moves, for
          <span class="win-stars">0</span> stars
        </p>
        <span class="win-button">
          Play another game!
        </span>
      </div>
    </section>
  </div>

  <!-- <script src="js/bundle_vanilla.js"></script> -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
